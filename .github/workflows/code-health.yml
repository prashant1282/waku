name: Code Health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Uzera CLI
        run: |
          curl -fsSL "https://api.gainserv.com/api/uzera/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Index repository
        run: uzera index --project "${{ github.workspace }}"

      - name: Run code health scan
        env:
          UZERA_SCANNER_KEY: ${{ secrets.UZERA_SCANNER_KEY }}
        run: uzera codehealth --project "${{ github.workspace }}"
